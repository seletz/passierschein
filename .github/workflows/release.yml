name: Release

# Runs on a pushed v* tag (`mise run release` creates it). Builds archives,
# CycloneDX SBOMs and checksums for darwin and linux (amd64, arm64), creates
# the GitHub release and publishes the documentation of the tag on GitHub
# Pages. Every build step is a mise task: Go, goreleaser and cyclonedx-gomod
# come pinned from mise.toml, and mise checks the cosign signature and the SLSA
# provenance of the goreleaser download.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Check
        run: mise run check

      - name: Release
        run: mise run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarization (notarize.macos in .goreleaser.yml).
          # Without MACOS_SIGN_P12 the darwin binaries ship unsigned.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Check the SBOMs
        run: mise run release:sbom:check

      # Build provenance (SLSA) for every file that the checksum file lists.
      # GitHub offers artifact attestations for private repositories only on
      # GitHub Enterprise Cloud, so the step runs only when the repository is
      # public.
      - name: Attest the build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums-${{ github.ref_name }}.txt

  docs:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Build the docs of the tag
        run: mise run docs:build
        env:
          DOCS_VERSION: ${{ github.ref_name }}

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a running deployment is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
